plugins {
	id 'java'
}

repositories {
	mavenLocal()

	maven {
		url = 'https://repo.runelite.net'
		content {
			includeGroupByRegex('net\\.runelite.*')
		}
	}

	mavenCentral()
}

// Pinned rather than 'latest.release' so builds are reproducible; bump deliberately.
def runeLiteVersion = '1.13.1'
def pluginMainClass = 'com.gecalc.GECalcPluginTest'

dependencies {
	compileOnly "net.runelite:client:${runeLiteVersion}"

	compileOnly 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'

	testImplementation 'junit:junit:4.13.2'
	testImplementation "net.runelite:client:${runeLiteVersion}"
	testImplementation "net.runelite:jshell:${runeLiteVersion}"
}

group = 'com.gecalc'
version = '1.2.2'

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release.set(11)
	options.compilerArgs.addAll(['-Xlint:deprecation', '-Xlint:unchecked'])
}

tasks.withType(JavaExec).configureEach {
	enableAssertions = true
}

tasks.register('run', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = pluginMainClass

	args '--developer-mode', '--debug'
}

tasks.register('testPlugin') {
	dependsOn('run')
	description = 'Alias for run task'
	group = 'execution'
}

tasks.register('shadowJar', Jar) {
	dependsOn configurations.runtimeClasspath

	manifest {
		attributes(
				'Multi-Release': true
		)
	}

	duplicatesStrategy = DuplicatesStrategy.EXCLUDE

	from sourceSets.main.output

	from {
		configurations.runtimeClasspath.collect { file ->
			file.isDirectory() ? file : zipTree(file)
		}
	}

	exclude 'META-INF/INDEX.LIST'
	exclude 'META-INF/*.SF'
	exclude 'META-INF/*.DSA'
	exclude 'META-INF/*.RSA'
	exclude '**/module-info.class'

	group = BasePlugin.BUILD_GROUP
	archiveClassifier.set('shadow')
	archiveFileName.set("${rootProject.name}-${project.version}-all.jar")
}
